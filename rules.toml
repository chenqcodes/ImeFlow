# 通用默认：不需要为每个软件重复配置。
# 手动控件规则 > 软件区域规则 > 软件默认 > 通用默认。
# 英文指当前中文输入法的英文状态；layout-english 才是 ENG 布局。
[defaults]
edit = "native-chinese"
terminal = "ime-english"
address-bar = "ime-english"
password = "ime-english"
code-editor = "ime-english"
other = "passthrough"

# 常用软件补充：仅补足未分类区域，不覆盖已识别的密码框、终端等。
# 若不需要这些预设，可通过点选面板删除对应的“此软件同类区域”规则。
[[rules]]
process = "WeChat.exe"
control = "other"
mode = "native-chinese"

[[rules]]
process = "Weixin.exe"
control = "other"
mode = "native-chinese"

[[rules]]
process = "ChatGPT.exe"
control = "other"
mode = "native-chinese"

[[rules]]
process = "notepad.exe"
control = "other"
mode = "native-chinese"

[[rules]]
process = "WindowsTerminal.exe"
control = "other"
mode = "ime-english"

[[rules]]
process = "powershell.exe"
control = "other"
mode = "ime-english"

[[rules]]
process = "pwsh.exe"
control = "other"
mode = "ime-english"

[[rules]]
process = "cmd.exe"
control = "other"
mode = "ime-english"

[[rules]]
process = "conhost.exe"
control = "other"
mode = "ime-english"
